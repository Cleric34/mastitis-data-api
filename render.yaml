databases:
  - name: mastitis-cloud-db
    databaseName: mastitis
    user: mastitis

services:
  - type: web
    name: mastitis-data-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mastitis-cloud-db
          property: connectionString
